<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <style>
      .title { font: 700 30px 'Arial', sans-serif; fill: #0d47a1; }
      .txt { font: 500 20px 'Arial', sans-serif; fill: #1a237e; }
      .small { font: 500 18px 'Arial', sans-serif; fill: #37474f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="600" y="45" text-anchor="middle" class="title">Classificação de Imóveis Construídos (Padrão Construtivo)</text>

  <rect x="40" y="120" rx="16" ry="16" width="240" height="170" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="160" y="190" text-anchor="middle" class="txt">Base de imóveis</text>
  <text x="160" y="220" text-anchor="middle" class="txt">edificados</text>

  <rect x="340" y="120" rx="16" ry="16" width="250" height="170" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="465" y="178" text-anchor="middle" class="txt">Cálculo de valor</text>
  <text x="465" y="208" text-anchor="middle" class="txt">unitário (R$/m²)</text>
  <text x="465" y="238" text-anchor="middle" class="small">e padronização</text>

  <rect x="650" y="120" rx="16" ry="16" width="200" height="170" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="750" y="190" text-anchor="middle" class="txt">K-Means</text>
  <text x="750" y="220" text-anchor="middle" class="txt">k = 3</text>

  <rect x="910" y="95" rx="16" ry="16" width="250" height="220" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/>
  <text x="1035" y="165" text-anchor="middle" class="txt">Classes finais</text>
  <text x="1035" y="205" text-anchor="middle" class="txt">Baixo | Normal | Alto</text>
  <text x="1035" y="245" text-anchor="middle" class="small">(apartamentos e casas)</text>

  <line x1="280" y1="205" x2="340" y2="205" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="590" y1="205" x2="650" y2="205" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="850" y1="205" x2="910" y2="205" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
